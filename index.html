<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8">
  <meta name=" viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cyber Lab</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-seriff;
      background: #0b1120;
      color: white;
    }

    header {
      padding: 60px 20px;
      text-align: center;
      background: linear-gradient(135deg,
  #172554, #6d28d9);
    }

    h1{
      font-size: 42px;
      margin-bottom: 10px;
    }

    main{
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    .card{
      background: #172033;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid #334155
    }

    button{
      background: #a78bfa;
      color: #0b1120;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover{
      background: #c4b5fd;
    }

    footer{
      text-align: center;
      padding:25px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <header>
    <h1>My Cyber Lab</h1>
    <p>Building, learning and testing securely.</p>
  </header>

  <main>
    <section class="card">
      <h2> Welcome to my website</h2>
      <p> This is my first website, built from scratch using HTML and CSS.</p>
      <button onclick="showMessage()">Test the button</button>

      <p id="message"></p>
    </section>

    <section class="card">
      <h2>My learning Goals</h2>
      <ul>
        <li>learn web development</li>
        <li>Understand website security</li>
        <li>Practise ethical penetration testing</li>
      </ul>
    </section>
  </main>

  <footer>My Cyber Lab 2026</footer>

  <script>
    function showMessage() {
      document.getElementByld("message").textContent = 
        "Success! Your website is working.";
    }    
  </script>
</body>
</html>
